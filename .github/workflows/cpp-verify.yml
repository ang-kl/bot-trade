# Build + unit-test the read-only position verifier on Linux with g++/libssl —
# the Railway runtime, not just clang on a dev machine.
#
# THE PATH LIST INCLUDES cpp-exec's TRANSPORT ON PURPOSE. cpp-verify compiles
# ws_client.cpp and http_server.cpp out of cpp-exec rather than keeping a copy,
# so a change there is a change to THIS service too. Leaving them out would be
# a gate that cannot fire on the code it guards.
name: cpp-verify
on:
  pull_request:
    paths:
      - 'cpp-verify/**'
      - 'cpp-exec/src/ws_client.*'
      - 'cpp-exec/src/http_server.*'
      - 'cpp-exec/src/json.hpp'
      - 'cpp-exec/src/tests/fake_broker.hpp'
      - '.github/workflows/cpp-verify.yml'
  push:
    branches: [main]
    paths:
      - 'cpp-verify/**'
      - 'cpp-exec/src/ws_client.*'
      - 'cpp-exec/src/http_server.*'
      - 'cpp-exec/src/json.hpp'
      - 'cpp-exec/src/tests/fake_broker.hpp'
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the verifier's unit tests
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q g++ make libssl-dev
          make -C cpp-verify CXX=g++ test
          make -C cpp-verify CXX=g++ all
      - name: The binary links no order-writing code
        # The service's only real guarantee is structural, so it is checked
        # rather than asserted in a comment: if a future change links the
        # execution engine, this step fails.
        run: |
          if nm -C cpp-verify/bin/cpp-verify | grep -iE 'ExecEngine|placeOrder|amendPosition|closePosition|cancelOrder'; then
            echo "cpp-verify links order-writing code — the read-only guarantee is gone"
            exit 1
          fi
          echo "no order-writing symbols in bin/cpp-verify"
