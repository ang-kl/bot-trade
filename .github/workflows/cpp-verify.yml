# Build + unit-test the read-only position verifier on Linux with g++/libssl —
# the Railway runtime, not just clang on a dev machine.
#
# THE PATH LIST INCLUDES cpp-exec's TRANSPORT ON PURPOSE, and PR-AN changed the
# reason without changing the list. cpp-verify no longer compiles those files
# out of cpp-exec — it VENDORS byte-identical copies under cpp-verify/src/, so
# that its build context can be its own directory (the repository root's
# railway.json belongs to the Node service and wins over any panel setting on a
# fresh deploy; while the context was the root, this service built the trading
# agent, and then cpp-exec itself).
#
# So a change to cpp-exec's transport is still a change to THIS service: the
# copy must be re-synced, and agent/services/sidecar-pins.test.js goes red
# naming the file until it is. Leaving these paths out would be a gate that
# cannot fire on the code it guards.
name: cpp-verify
on:
  pull_request:
    paths:
      - 'cpp-verify/**'
      - 'cpp-exec/src/ws_client.*'
      - 'cpp-exec/src/http_server.*'
      - 'cpp-exec/src/json.hpp'
      - 'cpp-exec/src/tests/fake_broker.hpp'
      - '.github/workflows/cpp-verify.yml'
  push:
    branches: [main]
    paths:
      - 'cpp-verify/**'
      - 'cpp-exec/src/ws_client.*'
      - 'cpp-exec/src/http_server.*'
      - 'cpp-exec/src/json.hpp'
      - 'cpp-exec/src/tests/fake_broker.hpp'
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the verifier's unit tests
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q g++ make libssl-dev libcurl4-openssl-dev
          make -C cpp-verify CXX=g++ -j$(nproc) test
          make -C cpp-verify CXX=g++ -j$(nproc) all
      - name: The binary links no order-writing code
        # The service's only real guarantee is structural, so it is checked
        # rather than asserted in a comment: if a future change links the
        # execution engine, this step fails.
        run: |
          if nm -C cpp-verify/bin/cpp-verify | grep -iE 'ExecEngine|placeOrder|amendPosition|closePosition|cancelOrder'; then
            echo "cpp-verify links order-writing code — the read-only guarantee is gone"
            exit 1
          fi
          echo "no order-writing symbols in bin/cpp-verify"
